# Local-dev profile — runs on top of application.properties.
#
# Activate with: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
# or: --spring.profiles.active=local
#
# Phase 7 — disable the email-verification gate so the full funder/innovator
# flow can be exercised without intercepting the SMTP verification link. The
# production default (application.properties) keeps the gate on.
app.security.require-email-verification=false
