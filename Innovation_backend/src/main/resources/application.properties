# ==============================
# Application Identity
# ==============================
spring.application.name=Innovation_backend
server.port=8080

# ==============================
# PostgreSQL DataSource
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/innovation
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
# Phase 5C: switched from update → validate. Flyway is now the source of truth
# for the schema. Hibernate validates that entities match the live schema at
# startup but does not mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# Flyway migrations
# ==============================
# Spring Boot auto-configures Flyway when flyway-core is on the classpath.
# Migrations live under src/main/resources/db/migration/ and run on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==============================
# Jackson (JSON) Configuration
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Dar_es_Salaam

# ==============================
# Multipart (file uploads) — Phase 5C-B
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ==============================
# Storage (Phase 5C-B)
# ==============================
# Local filesystem root for project attachments. Default is under the
# current user's home so the JVM never needs sudo to bootstrap. Override
# for production with -Dinnovation.storage.root=/var/innovation/uploads
# or the INNOVATION_STORAGE_ROOT env var (Spring Boot relaxed binding).
innovation.storage.root=${INNOVATION_STORAGE_ROOT:${user.home}/innovation-uploads}

# ==============================
# JWT Configuration
# ==============================
# Change this secret in production! Must be at least 256 bits (32+ chars).
app.jwt.secret=ChangeThisToASecureRandomSecretKeyAtLeast64CharactersLongForHS512Algorithm

# ==============================
# Refresh tokens (Phase 6A)
# ==============================
# Short-lived access token (Authorization: Bearer). Frontend refreshes when
# it sees 401 (or proactively before expiry using X-Access-Expires-In-Ms).
# 15 minutes
app.refresh.access-expiration-ms=900000
# Long-lived refresh token, stored server-side as SHA-256 hash in an
# httpOnly cookie. Rotated on every use; reuse kills the whole family.
# 7 days
app.refresh.expiration-ms=604800000
app.refresh.cookie-name=refresh_token
# Set true in production (HTTPS required for the cookie to be sent).
# Local dev runs HTTP on 5173 → keep this false until you have TLS.
app.refresh.cookie-secure=false
app.refresh.cookie-path=/
app.refresh.cookie-same-site=Lax

# ==============================
# CORS (allow React frontend)
# ==============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.example.Innovation_backend=DEBUG


