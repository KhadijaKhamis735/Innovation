# ==============================
# Phase 6D test profile
# ==============================
# Loaded by @ActiveProfiles("test"). Replaces the production Postgres + Flyway +
# Gmail stack with H2 (PostgreSQL mode) so `mvn clean test` runs with zero
# external infrastructure: no Postgres, no Docker, no real SMTP.
#
# Production application.properties is unchanged — this file is opt-in.

# ==============================
# H2 DataSource (PostgreSQL compatibility mode)
# ==============================
spring.datasource.url=jdbc:h2:mem:innovation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================
# JPA / Hibernate
# ==============================
# Flyway is the source of truth in production; for tests we let Hibernate build
# the schema from the entities, then drop it on shutdown. Avoids needing the
# V1..V5 migrations to be PG-only-dialect compatible.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==============================
# Mail — never connect to a real SMTP server in tests
# ==============================
# EmailService swallows MailException, but pointing at localhost:2525 (a port
# nothing is listening on) keeps any accidentally-non-mocked send call from
# doing real work or hanging.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==============================
# JWT (Phase 6A)
# ==============================
# 70 bytes — comfortably above JJWT's 64-byte HS512 minimum.
app.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123456789

# ==============================
# Refresh token config (Phase 6A) — matches RefreshProperties field names
# ==============================
app.refresh.access-expiration-ms=900000
app.refresh.expiration-ms=604800000
app.refresh.cookie-name=refresh_token
app.refresh.cookie-secure=false
app.refresh.cookie-path=/
app.refresh.cookie-same-site=Lax

# ==============================
# Email URLs (Phase 6B / 6C)
# ==============================
app.email.verification-url=http://localhost:8080/api/auth/verify?token=
app.email.verification-expiration-ms=86400000
app.email.reset-url=http://localhost:8080/api/auth/reset-password?token=
app.email.reset-expiration-ms=3600000

# ==============================
# CORS — keep the real allowlist so SecurityConfig doesn't fail to wire
# ==============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
